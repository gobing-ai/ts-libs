name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      # The rule evaluators under `.spur/rules` and the rule-fixture gate shell out
      # to `rg`; the runner image ships none, and a missing rg makes the
      # lifecycle-bus rule report zero violations instead of failing.
      - name: Install ripgrep
        run: sudo apt-get update && sudo apt-get install -y ripgrep

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # Build first so cross-package type imports (e.g. ts-db -> ts-runtime/dist)
      # resolve during typecheck. A clean CI checkout has no prebuilt dist/.
      - name: Build
        run: bun run build

      - name: Lint
        run: bun run lint

      - name: Test
        run: bun run test
