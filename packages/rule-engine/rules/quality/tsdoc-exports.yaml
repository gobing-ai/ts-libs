# TSDoc export rules — every public export must carry a doc comment (JSDoc `/** */` or line `//`).
rules:
  - id: every-export-has-tsdoc
    description: "Every export (function, class, interface, type, const, enum) must have a preceding doc comment — either a JSDoc block (`/** ... */`) or a line comment (`// ...`) describing what it is and why."
    severity: error
    evaluator:
      type: tsdoc-export
      config:
        kinds:
          - function
          - class
          - interface
          - type
          - const
          - enum
    include:
      - "packages/**/src/**/*.ts"
      - "apps/**/src/**/*.ts"
    exclude:
      - "**/index.ts"
      - "**/node_modules/**"
      - "**/tests/**"
      - "**/*.test.ts"
      - "**/*.test.tsx"
