# Spur project configuration for ts-libs
# Generated by `spur init`; upgraded to schema 1.2 (bundled workflows; stock workflow YAMLs resolve from the package, not .spur/workflows).

$schema: "@gobing-ai/spur/schemas/spur-config.schema.json"
version: "1.2"
name: ts-libs

# ── Portable bootstrap (consumed by @gobing-ai/ts-infra runNodeApplication) ──
# Shared across spur and (future) spur-server. Keys map 1:1 to ts-infra's
# LoggingOptions / TelemetryOptions / database / SchedulerOptions.
bootstrap:
  logging:
    enabled: true
    level: debug
    console: false
    json: false
    file: true
    filePath: .spur/logs/spur.log
  telemetry:
    enabled: false
    serviceName: spur
    environment: development
  database:
    enabled: true
    driver: bun-sqlite
    url: .spur/spur.db
  scheduler:
    enabled: false

# ── Spur app section (validated by spurConfigSchema in @gobing-ai/spur-config) ──
agent:
  default: pi

rules:
  paths:
    - .spur/rules/**/*.yaml

# workflows:
#   paths:
#     - .spur/workflows/

redaction:
  enabled: false

# ── Planning (design §2.1 / §9) ──
tasks:
  active: docs/tasks
  folders:
    docs/tasks:
      baseCounter: 0
      label: Primary

features:
  dir: docs/features

# ── Release (spur builder bump-ver / drop-tags) ──
# Release plumbing knobs, declared explicitly. Values match the built-in
# defaults; adjust here instead of patching release code when conventions
# change. Version carriers beyond the built-ins: none needed — this repo is a
# workspace:* lockstep monorepo, so workspace package.json covers everything
# (the root package is always in the --all set via its own name).
builder:
  bump-ver:
    tagVersionSeparator: "-v"
    publishWorkflow: publish.yml
    releaseCommitType: chore
    releaseCommitScope: release
    ghRunListLimit: 5
    versionCarriers: []
