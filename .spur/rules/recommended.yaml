# Recommended preset — portable rule categories from global install.
# Use with: spur rule run --preset recommended
#
# Add local rule categories to extends to override or supplement global rules.
# Create category folders under .spur/rules/ (e.g. my-rules/).
name: recommended
extends:
  - typescript
  - structure
  - meta
# Note: `quality` (coverage-gate) is intentionally excluded — it runs only in
# test-post-check, after `bun run test` regenerates .coverage/lcov.info. Including
# it here would gate coverage in test-pre-check against a stale/partial lcov.
