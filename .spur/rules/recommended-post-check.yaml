# Recommended post-check preset — post-test documentation and coverage gates.
# Use with: spur rule run --preset recommended-post-check
#
# Runs AFTER tests (test-post-check). Enforces public export TSDoc and
# coverage-gate against fresh .coverage/lcov.info.
name: recommended-post-check
description: >
  Post-test quality gates: public export TSDoc and unit test coverage.
extends:
  - quality
