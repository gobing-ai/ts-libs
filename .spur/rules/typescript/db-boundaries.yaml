# Database boundary rules — keep schema and raw DB access in the db package seams.
include:
  - "packages/**/*.ts"
exclude:
  - "**/tests/**"
  - "**/*.test.ts"
  - "**/node_modules/**"
  - "**/dist/**"

rules:
  - id: no-raw-drizzle-builder-outside-dao
    description: "Drizzle query-builder calls (this.db.insert/select/update/delete) must stay inside the DAO layer. drizzle is an internal detail of @gobing-ai/ts-db (v0.2.0 facade)."
    severity: error
    evaluator:
      type: regex
      config:
        pattern: "this\\.db\\.(insert|select|update|delete)\\("
    exclude:
      - "packages/db/src/base-dao.ts"
      - "packages/db/src/entity-dao.ts"
      - "packages/db/src/queue-job-dao.ts"

  - id: no-drizzle-import-outside-db-package
    description: "drizzle-orm is an internal implementation detail of @gobing-ai/ts-db. No other package may import it — consume the ts-db facade instead (BaseDao/EntityDao + the predicate spec)."
    severity: error
    evaluator:
      type: forbidden-import
      config:
        forbidden:
          - specifier: "drizzle-orm"
          - specifier: "drizzle-orm/sqlite-core"
          - specifier: "drizzle-orm/bun-sqlite"
          - specifier: "drizzle-orm/d1"
          - specifier: "drizzle-zod"
        scope:
          include:
            - "packages/**/src/**/*.ts"
          exclude:
            - "packages/db/**"
            - "**/tests/**"
            - "**/*.test.ts"
            - "**/dist/**"

  - id: no-sqlite-table-outside-schema
    description: "sqliteTable() definitions must live under packages/db/src/schema/ or come from the defineTable() wrapper (the sanctioned schema-construction primitives)."
    severity: error
    evaluator:
      type: regex
      config:
        pattern: "sqliteTable\\("
    exclude:
      - "packages/db/src/schema/**"
      - "packages/db/src/define-table.ts"

  - id: no-ad-hoc-sqlite-init
    description: "Direct sqlite.run()/sqlite.exec()/PRAGMA calls must stay inside SQLite adapter code."
    severity: error
    evaluator:
      type: regex
      config:
        pattern: "sqlite\\.(run|exec)\\s*\\(|pragma\\s*\\("
    exclude:
      - "packages/db/src/adapters/**"

  - id: no-inline-ddl-outside-migrations
    description: "Inline DDL outside migration code risks schema drift."
    severity: error
    evaluator:
      type: regex
      config:
        pattern: "(CREATE TABLE|ALTER TABLE|DROP TABLE)"
        flags: "i"
    exclude:
      - "packages/db/src/migrate.ts"
      - "packages/db/src/embedded-migrations.ts"
      - "**/tests/**"
      - "**/*.test.ts"
