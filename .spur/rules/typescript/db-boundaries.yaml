# Database boundary rules — keep schema and raw DB access in the db package seams.
include:
  - "packages/**/*.ts"
exclude:
  - "**/tests/**"
  - "**/*.test.ts"
  - "**/node_modules/**"
  - "**/dist/**"

rules:
  - id: no-raw-drizzle-builder-outside-dao
    description: "Drizzle query-builder calls (this.db.insert/select/update/delete) must stay inside the DAO layer. drizzle is an internal detail of @gobing-ai/ts-db (v0.2.0 facade)."
    severity: error
    evaluator:
      type: regex
      config:
        pattern: "this\\.db\\.(insert|select|update|delete)\\("
    exclude:
      - "packages/db/src/base-dao.ts"
      - "packages/db/src/entity-dao.ts"
      - "packages/db/src/queue-job-dao.ts"

  - id: no-drizzle-import-outside-db-package
    description: "drizzle-orm is an internal implementation detail of @gobing-ai/ts-db. No other package may import it — consume the ts-db facade instead (BaseDao/EntityDao + the predicate spec)."
    severity: error
    evaluator:
      type: forbidden-import
      config:
        forbidden:
          - specifier: "drizzle-orm"
          - specifier: "drizzle-orm/sqlite-core"
          - specifier: "drizzle-orm/bun-sqlite"
          - specifier: "drizzle-orm/d1"
          - specifier: "drizzle-zod"
        scope:
          include:
            - "packages/**/src/**/*.ts"
          exclude:
            - "packages/db/**"
            - "**/tests/**"
            - "**/*.test.ts"
            - "**/dist/**"

  - id: no-sqlite-table-outside-schema
    description: "sqliteTable() definitions must live under packages/db/src/schema/ or come from the defineTable() wrapper (the sanctioned schema-construction primitives)."
    severity: error
    evaluator:
      type: regex
      config:
        pattern: "sqliteTable\\("
    exclude:
      - "packages/db/src/schema/**"
      - "packages/db/src/schema/define-table.ts"

  - id: no-ad-hoc-sqlite-init
    description: "Direct sqlite.run()/sqlite.exec()/PRAGMA calls must stay inside SQLite adapter code."
    severity: error
    evaluator:
      type: regex
      config:
        pattern: "sqlite\\.(run|exec)\\s*\\(|pragma\\s*\\("
    exclude:
      - "packages/db/src/adapters/**"

  - id: no-inline-ddl-outside-migrations
    description: "Inline DDL outside migration code risks schema drift."
    severity: error
    evaluator:
      type: regex
      config:
        pattern: "(CREATE TABLE|ALTER TABLE|DROP TABLE)"
        flags: "i"
    exclude:
      - "packages/db/src/migrate.ts"
      - "packages/db/src/embedded-migrations.ts"
      - "packages/db/src/schema/ddl.ts"
      - "packages/db/src/schema/define-table.ts"
      - "**/schema-sql.ts"
      - "packages/rule-engine/src/persistence/schema.ts"
      - "packages/llm-jsonl-importer/src/jsonl-importer-dao.ts"
      - "**/tests/**"
      - "**/*.test.ts"

  - id: no-hand-written-ddl-for-drizzle-tables
    description: "Tables with a Drizzle object must derive DDL via generateCreateTableSql, not hand-write CREATE TABLE — except migration files and the generator itself."
    severity: error
    evaluator:
      type: regex
      config:
        pattern: "CREATE\\s+TABLE"
        flags: "i"
    exclude:
      - "packages/db/src/migrate.ts"
      - "packages/db/src/embedded-migrations.ts"
      - "packages/db/src/schema/ddl.ts"
      - "packages/db/src/schema/define-table.ts"
      - "**/schema-sql.ts"
      - "packages/rule-engine/src/persistence/schema.ts"
      - "packages/llm-jsonl-importer/src/jsonl-importer-dao.ts"
      - "**/tests/**"
      - "**/*.test.ts"

  - id: raw-sql-confined-to-persistence-seams
    description: >-
      Raw SQL statements (SELECT…FROM, INSERT INTO, UPDATE…SET, DELETE FROM, and
      table DDL) encode database structure — table and column names. When they
      spread across drivers, handlers, and business logic, a schema change ripples
      everywhere and the package can never be refactored cleanly. So raw SQL must
      stay confined to each package's dedicated persistence + schema seam (its
      `persistence`/`db-adapter` and `schema`/`schema-sql` files); everything else
      consumes the persistence layer's typed methods, not SQL text. `packages/db`
      is exempt — it is the facade that owns SQL on everyone's behalf (ADR-005).
      A match outside the allowlist means the statement belongs in the package's
      persistence seam, or the allowlist needs an ADR-traceable addition.
    severity: error
    evaluator:
      # `rg` (ripgrep): linear-time, and its include/exclude globs are forwarded
      # straight to ripgrep — correct `**` semantics, the dialect spur prefers over
      # the in-process `regex` evaluator. Pattern matches SQL *statements*, not the
      # execution functions, so SQL can't leak regardless of how it is run.
      type: rg
      config:
        # DML branches are clause-anchored (…FROM, …SET) so prose like "update the
        # record" cannot trip them; the DDL branch anchors on `TABLE <name> (`/`;`
        # (with optional IF [NOT] EXISTS + quoting) so "create a table of contents"
        # is skipped too. Tighter DDL form adapted from spur-new's dao-boundary.
        pattern: '\b(SELECT\s+[\s\S]{0,300}?\s+FROM\s|INSERT\s+INTO\s|UPDATE\s+[a-zA-Z_."]+\s+SET\s|DELETE\s+FROM\s)|(CREATE|ALTER|DROP)\s+TABLE\s+(IF\s+(NOT\s+)?EXISTS\s+)?["''`]?[A-Za-z_][A-Za-z0-9_]*["''`]?\s*[(;]'
        flags: 'i'
    include:
      - "packages/**/src/**/*.ts"
    exclude:
      - "packages/db/**"
      - "packages/dual-workflow-engine/src/persistence.ts"
      - "packages/dual-workflow-engine/src/schema-sql.ts"
      - "packages/llm-jsonl-importer/src/jsonl-importer-dao.ts"
      - "packages/llm-jsonl-importer/src/schema-sql.ts"
      - "packages/rule-engine/src/persistence/db-adapter.ts"
      - "packages/rule-engine/src/persistence/schema.ts"
      - "**/tests/**"
      - "**/*.test.ts"

  - id: no-sql-text-imports
    description: >-
      `.sql` text-imports (`import sql from './x.sql' with { type: 'text' }`) move
      SQL out of the source the scanner can see AND are non-portable through the
      build/publish pipeline (the `.sql` asset is not emitted to `dist`). Keep SQL
      inline in `.ts` inside the package's persistence seam, or derive DDL via the
      schema helpers — never a text-import. Forbidden everywhere, including the
      persistence seams. Adapted from spur-new's dao-boundary (ADR-005).
    severity: error
    evaluator:
      type: rg
      config:
        pattern: 'from\s+["''][^"'']*\.sql["'']'
    include:
      - "packages/**/src/**/*.ts"
    exclude:
      - "**/tests/**"
      - "**/*.test.ts"
