# ══════════════════════════════════════════════════════════════════════════
# Runtime boundary rules
# ══════════════════════════════════════════════════════════════════════════
#
# packages/runtime/ is the single seam for platform-specific APIs.
# All other packages MUST route file I/O, process execution, path math,
# environment access, and platform detection through @gobing-ai/ts-runtime.
#
# Background: ADR-008 (runtime selection), ADR-010 (plugin core), task 0012.
#
# Tests are excluded from all rules — test fixtures use platform APIs directly.
# ══════════════════════════════════════════════════════════════════════════

include:
  - "packages/**/*.ts"
exclude:
  - "**/tests/**"
  - "**/*.test.ts"
  - "**/*.spec.ts"
  - "**/*.d.ts"
  - "**/node_modules/**"
  - "**/dist/**"

rules:
  # ── Process execution ──────────────────────────────────────────────────

  - id: no-direct-process-spawn
    description: "Process spawning must go through @gobing-ai/ts-runtime's ProcessExecutor."
    severity: error
    evaluator:
      type: forbidden-import
      config:
        forbidden:
          - specifier: "node:child_process"
          - specifier: "child_process"
          - pattern: "Bun\\.(spawn|spawnSync)\\s*\\("
            matchMode: usage
          - pattern: "import\\s*\\{\\s*\\$"
            matchMode: usage
          - specifier: "execa"
          - specifier: "zx"
        scope:
          include:
            - "packages/**/*.ts"
          exclude:
            - "**/tests/**"
            - "**/dist/**"
            - "packages/runtime/src/process-executor.ts"

  - id: no-direct-process-exit
    description: "process.exit() must go through @gobing-ai/ts-utils exitProcess()."
    severity: error
    evaluator:
      type: forbidden-import
      config:
        forbidden:
          # Dot access: process.exit(...)
          - pattern: "process\\.exit\\b"
            matchMode: usage
          # Bracket/computed access: process['exit'] / process[\"exit\"]
          - pattern: "process\\s*\\[\\s*[\"']exit[\"']\\s*\\]"
            matchMode: usage
        scope:
          include:
            - "packages/**/src/**/*.ts"
          exclude:
            - "**/tests/**"
            - "**/dist/**"
            # The single sanctioned seam: exitProcess() lives here and owns the
            # only legitimate process.exit call in the workspace.
            - "packages/utils/src/output.ts"

  - id: no-shadow-exit-helper
    description: "exitProcess() may only be defined in @gobing-ai/ts-utils output.ts; other modules must import it, not redeclare it (prevents bypassing the sanctioned exit seam)."
    severity: error
    evaluator:
      type: regex
      config:
        # Catch local re-declarations of an exit helper that would shadow the
        # canonical ts-utils export: function exitProcess / const exitProcess =
        pattern: "(function\\s+exitProcess\\b|(?:const|let|var)\\s+exitProcess\\s*=)"
    include:
      - "packages/**/src/**/*.ts"
    exclude:
      - "**/tests/**"
      - "**/dist/**"
      - "packages/utils/src/output.ts"

  # ── File system I/O ────────────────────────────────────────────────────

  - id: no-direct-fs-io
    description: "File I/O must go through @gobing-ai/ts-runtime's FileSystem abstraction."
    severity: error
    evaluator:
      type: forbidden-import
      config:
        forbidden:
          - pattern: "from\\s+['\"]node:fs(?:/promises)?['\"]|require\\(['\"]node:fs"
            matchMode: usage
          - pattern: "\\bBun\\.(?:write|file)\\("
            matchMode: usage
        scope:
          include:
            - "packages/**/*.ts"
          exclude:
            - "**/tests/**"
            - "**/dist/**"
            - "packages/runtime/src/fs.ts"
            - "packages/runtime/src/file-system.ts"
            - "packages/runtime/src/file-system-node.ts"
            - "packages/runtime/src/file-system-cf.ts"
            - "packages/infra/src/application-node.ts"

  # ── Path math ──────────────────────────────────────────────────────────

  - id: no-direct-node-path
    description: "Path math must go through @gobing-ai/ts-runtime path utilities."
    severity: error
    evaluator:
      type: forbidden-import
      config:
        forbidden:
          - specifier: "node:path"
          - specifier: "path"
        scope:
          include:
            - "packages/**/*.ts"
          exclude:
            - "**/tests/**"
            - "**/dist/**"
            - "packages/runtime/src/fs.ts"
            - "packages/runtime/src/file-system.ts"
            - "packages/runtime/src/file-system-node.ts"
            - "packages/runtime/src/file-system-cf.ts"
            - "packages/runtime/src/path.ts"
            - "packages/runtime/src/bun-sqlite.ts"
            - "packages/runtime/src/extension/extension-loader.ts"
            - "packages/infra/src/application-node.ts"

  - id: no-direct-node-url
    description: "fileURLToPath must go through @gobing-ai/ts-runtime when bundling-aware path resolution is needed."
    severity: error
    evaluator:
      type: forbidden-import
      config:
        forbidden:
          - specifier: "node:url"
          - specifier: "url"
        scope:
          include:
            - "packages/**/*.ts"
          exclude:
            - "**/tests/**"
            - "**/dist/**"

  # ── OS / platform ──────────────────────────────────────────────────────

  - id: no-direct-node-os
    description: "node:os must go through @gobing-ai/ts-runtime (or inline the specific call)."
    severity: error
    evaluator:
      type: forbidden-import
      config:
        forbidden:
          - specifier: "node:os"
          - specifier: "os"
        scope:
          include:
            - "packages/**/*.ts"
          exclude:
            - "**/tests/**"
            - "**/dist/**"

  # ── Bun-specific APIs ──────────────────────────────────────────────────

  - id: no-direct-bun-platform
    description: "Bun platform APIs must go through @gobing-ai/ts-runtime."
    severity: error
    evaluator:
      type: forbidden-import
      config:
        forbidden:
          - pattern: "\\bBun\\.(which|env|argv|sleep|semver|password|navigator|colorDepth|gc|unsafe|inspect|nanoseconds|deepEquals|escapeHTML|fileURLToPath|pathToFileURL|build|main|version_with_revision|rev)\\s*[\\(\\[]"
            matchMode: usage
        scope:
          include:
            - "packages/**/*.ts"
          exclude:
            - "**/tests/**"
            - "**/dist/**"
            - "packages/runtime/src/platform.ts"

  # ── Environment variables ───────────────────────────────────────────────

  - id: no-direct-process-env
    description: "Direct process.env access must go through @gobing-ai/ts-runtime config helpers."
    severity: error
    evaluator:
      type: forbidden-import
      config:
        forbidden:
          - pattern: "process\\.env"
            matchMode: usage
        scope:
          include:
            - "packages/**/*.ts"
          exclude:
            - "**/tests/**"
            - "**/*.d.ts"
            - "**/dist/**"
            - "packages/runtime/src/config.ts"
            - "packages/runtime/src/bun-sqlite.ts"


  # ── Optional peer / build-order cycle ─────────────────────────────────

  - id: no-static-ts-db-import-in-runtime
    description: >-
      ts-runtime builds BEFORE ts-db (ts-db depends on ts-runtime, so the build
      order is runtime → db). A literal-specifier `import('@gobing-ai/ts-db')`
      — whether in a `typeof import()` type annotation or a value-position
      `await import()` — forces tsc to statically resolve the module at build
      time. In a clean CI checkout no prebuilt ts-db dist/ exists yet, so this
      raises TS2307. (Locally it passes by accident via a stale global
      ~/node_modules fallback.) ts-db is an optional peerDependency of
      ts-runtime (ADR-012 addendum); the sanctioned pattern is a variable
      specifier: `const spec = '@gobing-ai/ts-db'; await import(spec)`, which
      is opaque to tsc's static resolver. Background: task 0040 regression,
      CI build failure on PR #103.
    severity: error
    evaluator:
      type: regex
      config:
        # Matches `import(` followed by an optional `typeof` and a string-literal
        # specifier `@gobing-ai/ts-db` (optionally with a subpath). The variable-
        # specifier escape hatch (`import(someVariable)`) does not match because
        # the argument is a bare identifier, not a quoted string.
        pattern: "import\\s*\\(\\s*['\"]@gobing-ai/ts-db(?:/[^'\"]*)?['\"]"
    include:
      - "packages/runtime/src/**/*.ts"
    exclude:
      - "**/tests/**"
      - "**/*.test.ts"
      - "**/dist/**"