# Decision boundary rules — keep the outbound-LLM-API SDK behind the ai-runner seam.
include:
  - "packages/**/*.ts"
exclude:
  - "**/tests/**"
  - "**/*.test.ts"
  - "**/node_modules/**"
  - "**/dist/**"

rules:
  - id: no-typesafe-sdk-import-outside-ai-runner
    description: "@typesafe-ai/sdk is an internal implementation detail of @gobing-ai/ts-ai-runner. No other package may import it — consume the DecisionMaker facade instead. The SDK is pre-1.0 and pinned exact (0.6.0); the boundary follows the ADR-005/ADR-006 drizzle precedent (ADR-traceable, no separate ADR)."
    severity: error
    evaluator:
      type: forbidden-import
      config:
        forbidden:
          - specifier: "@typesafe-ai/sdk"
        scope:
          include:
            - "packages/**/src/**/*.ts"
          exclude:
            - "packages/ai-runner/src/decision/typesafe-driver.ts"
            - "**/tests/**"
            - "**/*.test.ts"
            - "**/dist/**"

  - id: workflow-no-ai-policy-dependency
    description: "ADR-026: DecisionMaker HITL policy belongs to consuming applications. The workflow engine must not import ai-runner."
    severity: error
    evaluator:
      type: forbidden-import
      config:
        forbidden:
          - specifier: "@gobing-ai/ts-ai-runner"
        scope:
          include:
            - "packages/dual-workflow-engine/src/**/*.ts"

  - id: no-laya-driver-import-in-ai-runner
    description: "ADR-028 / task 0080: @gobing-ai/ts-ai-runner must not declare a dependency on or statically import @gobing-ai/ts-laya-mlx. The local driver is resolved dynamically at runtime."
    severity: error
    evaluator:
      type: forbidden-import
      config:
        forbidden:
          - specifier: "@gobing-ai/ts-laya-mlx"
        scope:
          include:
            - "packages/ai-runner/src/**/*.ts"

  - id: laya-mlx-process-executor-only
    description: "ADR-027 / task 0080: packages/laya-mlx must use ProcessExecutor from @gobing-ai/ts-runtime and never directly spawn processes via node:child_process or Bun.spawn."
    severity: error
    evaluator:
      type: forbidden-import
      config:
        forbidden:
          - specifier: "node:child_process"
          - specifier: "child_process"
          - pattern: "Bun\\.(spawn|spawnSync)\\s*\\("
            matchMode: usage
        scope:
          include:
            - "packages/laya-mlx/src/**/*.ts"

  - id: no-fm-driver-import-in-ai-runner
    description: "ADR-028 / task 0085: @gobing-ai/ts-ai-runner must not declare a dependency on or statically import @gobing-ai/ts-decision-fm. The local driver is resolved dynamically at runtime."
    severity: error
    evaluator:
      type: forbidden-import
      config:
        forbidden:
          - specifier: "@gobing-ai/ts-decision-fm"
        scope:
          include:
            - "packages/ai-runner/src/**/*.ts"

  - id: decision-fm-process-executor-only
    description: "ADR-029 / task 0085: packages/decision-fm must use ProcessExecutor from @gobing-ai/ts-runtime and never directly spawn processes via node:child_process or Bun.spawn."
    severity: error
    evaluator:
      type: forbidden-import
      config:
        forbidden:
          - specifier: "node:child_process"
          - specifier: "child_process"
          - pattern: "Bun\\.(spawn|spawnSync)\\s*\\("
            matchMode: usage
        scope:
          include:
            - "packages/decision-fm/src/**/*.ts"
